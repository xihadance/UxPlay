name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

env:
  BUILD_TYPE: RelWithDebInfo
  # Disable interactive features
  DEBIAN_FRONTEND: noninteractive
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            make \
            libssl-dev \
            libplist-dev \
            gstreamer1.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-x \
            libgl1-mesa-dev \
            libdbus-1-dev \
            pkg-config

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DNO_X11_DEPS=OFF -DNO_MARCH_NATIVE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Verify binary
        run: |
          test -x build/uxplay
          ls -la build/uxplay

      - name: Package binary
        run: tar -czf build/uxplay-linux-${{ runner.arch }}.tar.gz -C build uxplay -C "$GITHUB_WORKSPACE" LICENSE README.md lib/llhttp/LICENSE-MIT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uxplay-linux-${{ runner.arch }}
          path: build/uxplay-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Remove untrusted Homebrew AWS tap
        run: brew untap aws/tap || true

      - name: Install dependencies
        run: |
          brew install \
            cmake \
            openssl@3 \
            libplist \
            glib \
            gstreamer \
            gst-plugins-base \
            gst-plugins-good \
            orc \
            meson

      - name: Set OpenSSL path
        run: |
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DNO_X11_DEPS=ON -DNO_MARCH_NATIVE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Verify binary
        run: |
          test -x build/uxplay
          ls -la build/uxplay

      - name: Package binary
        run: tar -czf build/uxplay-macos-${{ runner.arch }}.tar.gz -C build uxplay -C "$GITHUB_WORKSPACE" LICENSE README.md lib/llhttp/LICENSE-MIT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uxplay-macos-${{ runner.arch }}
          path: build/uxplay-macos-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-windows-intel:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        msystem: [UCRT64]
        include:
          - msystem: UCRT64
            pkg_prefix: mingw-w64-ucrt-x86_64
            path_prefix: ucrt64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.pkg_prefix }}-cmake
            ${{ matrix.pkg_prefix }}-gcc
            ${{ matrix.pkg_prefix }}-openssl
            ${{ matrix.pkg_prefix }}-libplist
            ${{ matrix.pkg_prefix }}-gstreamer
            ${{ matrix.pkg_prefix }}-gst-plugins-base
            ${{ matrix.pkg_prefix }}-gst-plugins-good
            ${{ matrix.pkg_prefix }}-gst-plugins-bad
            ${{ matrix.pkg_prefix }}-gst-libav
            ${{ matrix.pkg_prefix }}-pkg-config
            base-devel

      - name: Configure CMake
        env:
          PKG_CONFIG_PATH: /${{ matrix.path_prefix }}/lib/pkgconfig
        run: |
          echo "MSYS2_RUNTIME_PREFIX=$(cygpath -w "$MINGW_PREFIX")" >> "$GITHUB_ENV"
          cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DNO_X11_DEPS=ON -DNO_MARCH_NATIVE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Verify binary
        run: |
          test -f build/uxplay.exe
          ls -la build/uxplay.exe

      - name: Package Windows runtime
        shell: pwsh
        run: ./scripts/package-windows.ps1 -RuntimePrefix $env:MSYS2_RUNTIME_PREFIX -Architecture x64

      - name: Verify portable runtime
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1 -PackageDirectory build/artifacts/uxplay-windows-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uxplay-windows-x64
          path: build/artifacts/uxplay-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  build-windows-arm64:
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        msystem: [CLANGARM64]
        include:
          - msystem: CLANGARM64
            pkg_prefix: mingw-w64-clang-aarch64
            path_prefix: clangarm64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.pkg_prefix }}-cmake
            ${{ matrix.pkg_prefix }}-gcc
            ${{ matrix.pkg_prefix }}-openssl
            ${{ matrix.pkg_prefix }}-libplist
            ${{ matrix.pkg_prefix }}-gstreamer
            ${{ matrix.pkg_prefix }}-gst-plugins-base
            ${{ matrix.pkg_prefix }}-gst-plugins-good
            ${{ matrix.pkg_prefix }}-gst-plugins-bad
            ${{ matrix.pkg_prefix }}-gst-libav
            ${{ matrix.pkg_prefix }}-pkg-config
            base-devel

      - name: Configure CMake
        env:
          PKG_CONFIG_PATH: /${{ matrix.path_prefix }}/lib/pkgconfig
        run: |
          echo "MSYS2_RUNTIME_PREFIX=$(cygpath -w "$MINGW_PREFIX")" >> "$GITHUB_ENV"
          cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DNO_X11_DEPS=ON -DNO_MARCH_NATIVE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Verify binary
        run: |
          test -f build/uxplay.exe
          ls -la build/uxplay.exe

      - name: Package Windows runtime
        shell: pwsh
        run: ./scripts/package-windows.ps1 -RuntimePrefix $env:MSYS2_RUNTIME_PREFIX -Architecture arm64

      - name: Verify portable runtime
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1 -PackageDirectory build/artifacts/uxplay-windows-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uxplay-windows-arm64
          path: build/artifacts/uxplay-windows-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    needs: [build-linux, build-macos, build-windows-intel, build-windows-arm64]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build packages
        uses: actions/download-artifact@v8
        with:
          pattern: uxplay-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.zip release-assets/*.tar.gz)
          if [[ ${#assets[@]} -ne 4 ]]; then
            echo "Expected four platform packages, found ${#assets[@]}." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            title="UxPlay $tag"
            release_flags=(--verify-tag --latest)
          else
            tag="build-$GITHUB_RUN_NUMBER"
            title="UxPlay build $GITHUB_RUN_NUMBER"
            release_flags=(--prerelease --latest=false)
          fi

          cat > release-notes.md <<'EOF'
          Windows: download the x64 or ARM64 ZIP, extract the entire archive,
          and run start-uxplay.cmd. MSYS2 and Bonjour are not required.

          Linux and macOS: download the matching tar.gz package and install
          the runtime dependencies described in README.md.
          EOF
          printf '\nCommit: `%s`\nBuild: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md \
              "${release_flags[@]}"
          fi

